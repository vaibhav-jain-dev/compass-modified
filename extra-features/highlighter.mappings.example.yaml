# Example mapping file. One file per database, stored next to highlighter.yaml
# as mappings/<database>.yaml (e.g. ~/compass-highlighter/mappings/shop.yaml).
# Mappings describe the data model (which field points at which document) and
# are independent of features, so they live in their own file.
#
# `from`: collection.path in this database, same path syntax as highlighter.yaml
#         (`[]` for array elements)
# `to`:   collection.path the value points at; the path defaults to _id
# `as`:   auto (default) matches both ObjectId and its hex string, for
#         collections that store ids as text; objectId / string force one shape
# `label`: shown on the link and as the popup title
#
# In the Documents tab a mapped field gets a link icon: clicking it opens the
# related documents in a popup. Fields inside the popup are mapped too, so the
# popups nest; "Open in new tab" opens the collection with the same filter.

version: 1
database: shop

mappings:
  - from: orders.customerId
    to: customers._id
    label: Customer
  - from: orders.items[].sku
    to: products.sku
    label: Product
    as: string
  - from: customers.defaultAddressId
    to: addresses._id
    label: Default address
  - from: inventory_reservations.orderId
    to: orders._id
    label: Order
    notes: One reservation per order line.
